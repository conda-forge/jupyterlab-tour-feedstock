{% set name = "jupyterlab-tour" %}
{% set version = "4.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: de79689fffc15c3b4f4771927a8effffdfc68cd8698184ac1cd3417d50f24a41

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - hatch-jupyter-builder >=0.5
    - hatch-nodejs-version
    - hatchling >=1.5.0
    - jupyterlab =4
    - pip
    - python {{ python_min }}
  run:
    - python >={{ python_min }},<4.0

test:
  requires:
    - pip
    - jupyterlab
    - python {{ python_min }}
  commands:
    - pip check
    - jupyter labextension list 2>&1 | grep -ie "jupyterlab-tour.*OK.*(python, jupyterlab-tour)"

about:
  home: https://github.com/jupyterlab-contrib/jupyterlab-tour
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A JupyterLab UI tour built on jupyterlab-tutorial and react-joyride.

extra:
  recipe-maintainers:
    - bollwyvl
    - fcollonval
